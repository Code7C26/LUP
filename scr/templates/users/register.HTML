<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lüp - Crear Cuenta</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --verde-lup: #4F8A5B;
            --verde-oscuro: #315C3B;
            --verde-claro: #E8F3E9;
            --crema: #F8F6EF;
            --gris: #5F6B61;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--crema);
            color: #26352A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .register-card {
            background: white;
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 10px 30px rgba(49, 92, 59, 0.08);
            width: 100%;
            max-width: 480px;
        }

        .logo {
            font-size: 36px;
            font-weight: 700;
            color: var(--verde-oscuro);
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .logo span {
            color: var(--verde-lup);
        }

        .form-control {
            border-radius: 12px;
            padding: 10px 14px;
            border: 1px solid #DCE3DB;
        }

        .btn-lup {
            background-color: var(--verde-lup);
            color: white;
            border-radius: 20px;
            padding: 11px;
            font-weight: 600;
            width: 100%;
            border: none;
            margin-top: 15px;
        }

        .btn-lup:hover {
            background-color: var(--verde-oscuro);
            color: white;
        }

        .helptext {
            font-size: 11px;
            color: var(--gris);
            display: block;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="register-card">

        <a href="/" class="logo mb-2">L<span>ü</span>p</a>
        <h4 class="text-center fw-bold mb-4" style="color: var(--verde-oscuro);">Creá tu cuenta</h4>

        <form method="post">
            {% csrf_token %}
            
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label text-secondary small fw-medium">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                        <span class="helptext">{{ field.help_text }}</span>
                    {% endif %}
                    {% for error in field.errors %}
                        <div class="text-danger small mt-1">{{ error }}</div>
                    {% endfor %}
                </div>
            {% endfor %}

            <button type="submit" class="btn btn-lup">Registrarme</button>
        </form>

        <div class="text-center mt-4 fs-6 style='color: var(--gris);'">
            ¿Ya tenés una cuenta? <br>
            <a href="/usuarios/login/" class="fw-bold" style="color: var(--verde-lup); text-decoration: none;">Iniciá sesión acá</a>
        </div>

    </div>

</body>
</html>
