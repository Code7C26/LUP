{% extends 'base.html' %}
{% load lup_tags %}

{% block title %}Eliminar publicación · Lüp{% endblock %}

{% block content %}
<div class="container pt-5" style="max-width: 560px;">
    <div class="tarjeta text-center">
        <div class="display-5 mb-2">🗑️</div>
        <h1 class="h4">¿Eliminar "{{ producto.titulo }}"?</h1>
        <p class="text-muted-lup">Se borrará la publicación y sus reservas asociadas. Esta acción no se puede deshacer.</p>
        <form method="post" class="d-flex gap-2 justify-content-center mt-4">
            {% csrf_token %}
            <a href="{% url 'panel' %}" class="btn btn-light">Cancelar</a>
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        </form>
    </div>
</div>
{% endblock %}
