<div class="row g-4" data-total="{{ productos|length }}">
    {% for producto in productos %}
        <div class="col-sm-6 col-lg-4 col-xl-3">{% include 'includes/_producto_card.html' %}</div>
    {% empty %}
        <div class="col-12">
            <div class="vacio">
                <div class="emoji mb-2">🔍</div>
                <h5>No encontramos ofertas con esos filtros</h5>
                <p class="text-muted-lup mb-3">Probá con otra búsqueda o volvé más tarde: los comercios publican durante todo el día.</p>
                <a href="{% url 'catalogo' %}" class="btn btn-lup-outline btn-sm">Limpiar filtros</a>
            </div>
        </div>
    {% endfor %}
</div>
