<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lüp - Una segunda oportunidad</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Google Fonts (Poppins) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --verde-lup: #4F8A5B;
            --verde-oscuro: #315C3B;
            --verde-claro: #E8F3E9;
            --crema: #F8F6EF;
            --gris: #5F6B61;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--crema);
            color: #26352A;
            margin: 0;
        }

        /* NAVBAR BLANCA (Estilo unificado) */
        .navbar-lup {
            background-color: #ffffff !important;
            padding: 18px 0;
            border-bottom: 1px solid #E4E9E3;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: var(--verde-oscuro);
            text-decoration: none;
        }

        .logo span {
            color: var(--verde-lup);
        }

        .btn-login {
            border: 1.5px solid var(--verde-lup);
            color: var(--verde-lup);
            border-radius: 25px;
            padding: 8px 20px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-login:hover {
            background-color: var(--verde-lup);
            color: white;
        }
    </style>
</head>
<body>

    <!-- NAVBAR BLANCA UNIFICADA -->
    <nav class="navbar-lup">
        <div class="container d-flex justify-content-between align-items-center">
            
            <!-- Logo Lüp -->
            <a href="/" class="logo">
                L<span>ü</span>p
            </a>

            <!-- Botón de Iniciar Sesión / Perfil -->
            <div>
                {% if request.user.is_authenticated %}
                    <span class="me-3 fw-semibold text-success">
                        <i class="bi bi-person-circle me-1"></i>{{ request.user.username }}
                    </span>
                    <a href="/usuarios/logout/" class="btn btn-login">Cerrar sesión</a>
                {% else %}
                    <a href="/usuarios/login/" class="btn btn-login">Iniciar sesión</a>
                {% endif %}
            </div>

        </div>
    </nav>

    <!-- CONTENIDO DINÁMICO DE PRODUCTOS O CUALQUIER OTRA VISTA -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="text-center py-4 text-white mt-5" style="background-color: var(--verde-oscuro);">
        <div class="container">
            <p class="mb-0 small">Lüp · Una segunda oportunidad para cada alimento 🌱</p>
        </div>
    </footer>

</body>
</html>
