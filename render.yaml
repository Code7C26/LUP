# ==========================================================
#  Lüp en Render (Blueprint)
#  Render lee este archivo y crea la página web y la base de datos.
#  Pasos completos en el README: "Publicar la página".
# ==========================================================
services:
  - type: web
    name: lup
    runtime: python
    plan: 0.5c-512mb         # "Starter": 0.5 CPU / 512 MB, pago (el gratis no manda emails ni guarda las fotos)
    region: virginia         # la más cercana a Argentina
    branch: main             # cada cambio que llega a main se publica solo
    autoDeploy: true
    buildCommand: ./build.sh
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn scr.lup.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /salud/
    disk:                    # fotos de productos, logos y fotos de perfil (no se borran al actualizar)
      name: fotos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lup-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/media
      # Las claves se cargan en el panel de Render cuando se crea (nunca en GitHub)
      - key: GMAIL_USUARIO
        sync: false
      - key: GMAIL_CLAVE_APP
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      # Con dominio propio, agregar en el panel (Environment):
      #   DJANGO_ALLOWED_HOSTS = lupalimentos.com,www.lupalimentos.com
      #   SITIO_URL            = https://lupalimentos.com

databases:
  - name: lup-db
    plan: 0.1c-256mb         # PostgreSQL "Basic 256 MB", pago (la gratuita se borra a los 30 días)
    region: virginia
    databaseName: lup
    user: lup
